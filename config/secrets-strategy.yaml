# Configuración de External Secrets Operator para gestión federada de secretos
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    app.kubernetes.io/name: secrets-strategy
    secrets.backend: vault
    cluster-scope: "true"
spec:
  provider:
    vault:
      server: "https://vault.k8s.example.com:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets-operator
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  labels:
    app.kubernetes.io/name: secrets-strategy
    secrets.backend: aws
    cluster-scope: "true"
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-parameter-store
  labels:
    app.kubernetes.io/name: secrets-strategy
    secrets.backend: aws
    cluster-scope: "true"
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-secrets
  namespace: argocd
  labels:
    app.kubernetes.io/name: secrets-strategy
    managed-by: external-secrets
    environment: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Owner
  data:
    - secretKey: admin.password
      remoteRef:
        key: argocd/credentials
        property: admin.password
    - secretKey: server.secretkey
      remoteRef:
        key: argocd/credentials
        property: server.secretkey
    - secretKey: repo-creds
      remoteRef:
        key: argocd/credentials
        property: repo-creds
    - secretKey: dex.github.clientSecret
      remoteRef:
        key: argocd/dex
        property: github.clientSecret
    - secretKey: dex.okta.clientSecret
      remoteRef:
        key: argocd/dex
        property: okta.clientSecret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: crossplane-provider-secrets
  namespace: crossplane-system
  labels:
    app.kubernetes.io/name: secrets-strategy
    managed-by: external-secrets
    component: crossplane
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: crossplane-aws-provider-creds
    creationPolicy: Owner
  data:
    - secretKey: credentials
      remoteRef:
        key: crossplane/provider-aws
        property: credentials
    - secretKey: access_key_id
      remoteRef:
        key: crossplane/provider-aws
        property: access_key_id
    - secretKey: secret_access_key
      remoteRef:
        key: crossplane/provider-aws
        property: secret_access_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: platform-system
  labels:
    app.kubernetes.io/name: secrets-strategy
    managed-by: external-secrets
    tier: application
spec:
  refreshInterval: 30m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: ^database/.*
        namespace:
          regexp: ^(primary|standby)-.*$
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ingress-tls-secrets
  namespace: ingress-nginx
  labels:
    app.kubernetes.io/name: secrets-strategy
    managed-by: external-secrets
    component: ingress
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: ingress-tls
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
      data:
        tls.crt: "{{ .credential | cert | base64enc }}"
        tls.key: "{{ .key | base64enc }}"
  data:
    - secretKey: credential
      remoteRef:
        key: tls/wildcard-cert
        property: certificate
    - secretKey: key
      remoteRef:
        key: tls/wildcard-cert
        property: private_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: replication-secrets
  namespace: platform-system
  labels:
    app.kubernetes.io/name: secrets-strategy
    managed-by: external-secrets
    component: replication
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: replication-api-keys
    creationPolicy: Owner
  data:
    - secretKey: replication-api-key
      remoteRef:
        key: replication/api-keys
        property: primary-key
    - secretKey: replication-secret
      remoteRef:
        key: replication/api-keys
        property: secret
    - secretKey: failover-api-key
      remoteRef:
        key: failover/api-keys
        property: api-key
    - secretKey: failover-secret
      remoteRef:
        key: failover/api-keys
        property: secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: monitoring-credentials
  namespace: monitoring
  labels:
    app.kubernetes.io/name: secrets-strategy
    managed-by: external-secrets
    component: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: prometheus-api-key
    creationPolicy: Owner
  data:
    - secretKey: apiKey
      remoteRef:
        key: monitoring/prometheus
        property: apiKey
    - secretKey: alertmanager-slack-webhook
      remoteRef:
        key: monitoring/alerts
        property: slackWebhook
    - secretKey: pagerduty-key
      remoteRef:
        key: monitoring/alerts
        property: pagerdutyKey
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-kv
  namespace: external-secrets
  labels:
    app.kubernetes.io/name: secrets-strategy
spec:
  provider:
    vault:
      server: "https://vault.k8s.example.com:8200"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: kubernetes
          role: kv-reader
---
# Policy de Vault para lectura de secretos
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-policy-config
  namespace: platform-system
  labels:
    app.kubernetes.io/name: secrets-strategy
data:
  vault-policy.hcl: |
    # Policy para External Secrets Operator
    path "secret/data/*" {
      capabilities = ["read", "list"]
    }
    
    path "secret/metadata/*" {
      capabilities = ["read", "list"]
    }
    
    path "kv/data/*" {
      capabilities = ["read", "list"]
    }
    
    path "kv/metadata/*" {
      capabilities = ["read", "list"]
    }
    
    # Policy para replication
    path "secret/data/replication/*" {
      capabilities = ["read", "list", "write"]
    }
    
    path "secret/data/failover/*" {
      capabilities = ["read", "list", "write"]
    }
---
# Rollout strategy para rotación de secretos
apiVersion: external-secrets.io/v1beta1
kind: PushSecret
metadata:
  name: app-config-push
  namespace: applications
  labels:
    app.kubernetes.io/name: secrets-strategy
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: app-config
    creationPolicy: Owner
  selector:
    secretLabels:
      push-secret: "true"
  data:
    - key: app/config
      property: config.yaml
      algorithm: UTF8