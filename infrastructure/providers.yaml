apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: aws-primary
  namespace: crossplane-system
  labels:
    environment: production
    region: us-east-1
    cluster: primary
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-provider-creds
      key: credentials
  region: us-east-1
  skipCredsValidation: false
  skipMetadataApiCheck: false
---
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: aws-standby-us-east-2
  namespace: crossplane-system
  labels:
    environment: production
    region: us-east-2
    cluster: standby-us-east-2
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-provider-creds-standby
      key: credentials
  region: us-east-2
  skipCredsValidation: false
  skipMetadataApiCheck: false
---
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: aws-standby-us-west-1
  namespace: crossplane-system
  labels:
    environment: production
    region: us-west-1
    cluster: standby-us-west-1
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-provider-creds-standby
      key: credentials
  region: us-west-1
  skipCredsValidation: false
  skipMetadataApiCheck: false
---
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: aws-standby-us-west-2
  namespace: crossplane-system
  labels:
    environment: production
    region: us-west-2
    cluster: standby-us-west-2
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: aws-provider-creds-standby
      key: credentials
  region: us-west-2
  skipCredsValidation: false
  skipMetadataApiCheck: false
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-provider-creds
  namespace: crossplane-system
  labels:
    app: crossplane
    provider: aws
type: Opaque
stringData:
  credentials: |-
    [default]
    aws_access_key_id = ${AWS_ACCESS_KEY_ID}
    aws_secret_access_key = ${AWS_SECRET_ACCESS_KEY}
    region = us-east-1
---
apiVersion: v1
kind: Secret
metadata:
  name: aws-provider-creds-standby
  namespace: crossplane-system
  labels:
    app: crossplane
    provider: aws
    scope: standby
type: Opaque
stringData:
  credentials: |-
    [standby]
    aws_access_key_id = ${AWS_STANDBY_ACCESS_KEY_ID}
    aws_secret_access_key = ${AWS_STANDBY_SECRET_ACCESS_KEY}
    role_arn = arn:aws:iam::${STANDBY_ACCOUNT_ID}:role/CrossplaneProvisioner
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crossplane-provider-config
  namespace: crossplane-system
  labels:
    app: crossplane
    component: provider-config
data:
  provider-config.yaml: |-
    apiVersion: aws.upbound.io/v1beta1
    kind: ProviderConfig
    metadata:
      name: default
    spec:
      region: us-east-1
      credentials:
        source: Secret
        secretRef:
          namespace: crossplane-system
          name: aws-provider-creds
          key: credentials
  enable-external-name: "true"
  enable-managed-identities: "true"
  default-tags: |-
    Managed-By: Crossplane
    Project: multi-cluster-gitops
    Environment: production
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-provider-aws
  labels:
    app: crossplane
    provider: aws
    component: rbac
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.crossplane.io/aggregate-to-provider: "true"
rules: [] 
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-provider-aws-verbs
  labels:
    app: crossplane
    provider: aws
    rbac.crossplane.io/aggregate-to-provider: "true"
rules:
  - apiGroups: ["aws.upbound.io", "ec2.amazonaws.com", "rds.amazonaws.com", "iam.amazonaws.com", "s3.amazonaws.com"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: v1
kind: Namespace
metadata:
  name: crossplane-system
  labels:
    app: crossplane
    component: runtime
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crossplane
  namespace: crossplane-system
  labels:
    app: crossplane
    component: controller
spec:
  selector:
    matchLabels:
      app: crossplane
  replicas: 2
  template:
    metadata:
      labels:
        app: crossplane
    spec:
      serviceAccountName: crossplane
      containers:
        - name: crossplane
          image: crossplane/crossplane:v1.14.0
          args:
            - --debug
            - --enable-external-name-sts
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            fsGroup: 65532
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crossplane
  namespace: crossplane-system
  labels:
    app: crossplane
    component: security