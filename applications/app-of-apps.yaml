apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app-of-apps
  namespace: argocd
  labels:
    app.kubernetes.io/name: root-app-of-apps
    app.kubernetes.io/part-of: multi-cluster-control-plane
    app.kubernetes.io/managed-by: argocd
    tier: root
spec:
  project: default
  source:
    repoURL: https://github.com/org/multi-cluster-gitops-control-plane.git
    targetRevision: main
    path: applications
    directory:
      recurse: true
      jsonnet: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - PrunePropagationPolicy=foreground
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /spec/source/targetRevision
  revisionHistoryLimit: 10
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure-app
  namespace: argocd
  labels:
    app.kubernetes.io/name: infrastructure-app
    app.kubernetes.io/part-of: multi-cluster-control-plane
    app.kubernetes.io/managed-by: argocd
    tier: infrastructure
    environment: production
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/org/multi-cluster-gitops-control-plane.git
    targetRevision: main
    path: infrastructure
    directory:
      recurse: true
      exclude: "providers.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: aws.upbound.io
      kind: Instance
      jsonPointers:
        - /status
    - group: s3.aws.upbound.io
      kind: Bucket
      jsonPointers:
        - /status
  revisionHistoryLimit: 5
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-app
