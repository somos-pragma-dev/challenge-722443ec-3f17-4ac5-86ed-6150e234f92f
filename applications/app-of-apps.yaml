apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-app
  namespace: argocd
  labels:
    app.kubernetes.io/name: secrets-app
    app.kubernetes.io/part-of: multi-cluster-control-plane
    app.kubernetes.io/managed-by: argocd
    tier: security
spec:
  project: security
  source:
    repoURL: https://github.com/org/multi-cluster-gitops-control-plane.git
    targetRevision: main
    path: secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
      allowEmpty: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=false
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 10m
  ignoreDifferences:
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
  revisionHistoryLimit: 0
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: infrastructure
  namespace: argocd
  labels:
    app.kubernetes.io/name: project-infrastructure
    app.kubernetes.io/part-of: multi-cluster-control-plane
spec:
  description: Proyecto para recursos de infraestructura
  sourceRepos:
    - https://github.com/org/multi-cluster-gitops-control-plane.git
    - https://github.com/org/multi-cluster-gitops-control-plane.git/*
  destinations:
    - namespace: crossplane-system
      server: https://kubernetes.default.svc
    - namespace: vault
      server: https://kubernetes.default.svc
    - namespace: external-secrets
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
  roles:
    - name: infrastructure-admin
      description: Administrador de infraestructura
      groups:
        - platform-team@example.com
      policies:
        - p, proj:infrastructure:infrastructure-admin, *, *, *, allow
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: clusters
  namespace: argocd
  labels:
    app.kubernetes.io/name: project-clusters
    app.kubernetes.io/part-of: multi-cluster-control-plane
spec:
  description: Proyecto para definiciones de clusters
  sourceRepos:
    - https://github.com/org/multi-cluster-gitops-control-plane.git
  destinations:
    - namespace: clusters
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: cluster.x-k8s.io
      kind: Cluster
    - group: infrastructure.cluster.x-k8s.io
      kind: AWSCluster
  namespaceResourceWhitelist:
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
  roles:
    - name: cluster-admin
      description: Administrador de clusters
      groups:
        - cluster-admins@example.com
      policies:
        - p, proj:clusters:cluster-admin, *, *, *, allow
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: monitoring
  namespace: argocd
  labels:
    app.kubernetes.io/name: project-monitoring
    app.kubernetes.io/part-of: multi-cluster-control-plane
spec:
  description: Proyecto para monitoreo y observabilidad
  sourceRepos:
    - https://github.com/org/multi-cluster-gitops-control-plane.git
    - https://github.com/prometheus-community/helm-charts.git
  destinations:
    - namespace: monitoring
      server: https://kubernetes.default.svc
    - namespace: prometheus
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: monitoring.coreos.com
      kind: Prometheus
  namespaceResourceWhitelist:
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: monitoring.coreos.com
      kind: ServiceMonitor
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: security
  namespace: argocd
  labels:
    app.kubernetes.io/name: project-security
    app.kubernetes.io/part-of: multi-cluster-control-plane
spec:
  description: Proyecto para seguridad y secretos
  sourceRepos:
    - https://github.com/org/multi-cluster-gitops-control-plane.git
    - https://github.com/hashicorp/vault-helm.git
  destinations:
    - namespace: vault
      server: https://kubernetes.default.svc
    - namespace: external-secrets
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: security.openshift.io
      kind: SecurityContextConstraints
  namespaceResourceWhitelist:
    - group: ""
      kind: Secret
    - group: ""
      kind: ConfigMap
    - group: secrets-store.csi.x-k8s.io
      kind: SecretProviderClass
  roles:
    - name: security-admin
      description: Administrador de seguridad
      groups:
        - security-team@example.com
      policies:
        - p, proj:security:security-admin, *, *, *, allow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-of-apps-status
  namespace: argocd
  labels:
    app: argocd
    component: app-of-apps
data:
  status.yaml: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: app-of-apps-status
    data:
      applications: |
        - name: root-app-of-apps
          type: root
          status: Synced
          tier: root
        - name: infrastructure-app
          type: child
          status: Synced
          tier: infrastructure
        - name: config-app
          type: child
          status: Synced
          tier: configuration
        - name: clusters-app
          type: child
          status: Synced
          tier: cluster-definition
        - name: monitoring-app
          type: child
          status: Synced
          tier: observability
        - name: secrets-app
          type: child
          status: Synced
          tier: security
      projects: |
        - name: infrastructure
          status: Active
          apps: 1
        - name: clusters
          status: Active
          apps: 1
        - name: monitoring
          status: Active
          apps: 1
        - name: security
          status: Active
          apps: 1